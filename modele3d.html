<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modele 3D Himiko</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<style>
/* VOICE: warsztat Stoczni, rzeczowo i cicho; statek jest jedyną gwiazdą.
   IDEA: hala montażowa z jednym okrętem na środku i pulpitem operatora u dołu.
   PICTURE: model 3D na cały ekran, bez napisów na modelu.
   COLOUR and TYPE: grafit + pomarańcz strzałki ciągu z rzutów Stoczni; Barlow Condensed jak opisy rysunków.
   LAYOUT: płótno na cały ekran, wybór jednostki u góry, pulpit kątów i zapisu u dołu, karta danych jako szuflada. */
:root{color-scheme:dark;--bg:#0c0e11;--panel:rgba(22,25,30,.92);--ink:#e9ecef;--dim:#9aa3ad;--line:#2c323a;--acc:#e0642f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif;overflow:hidden}
#scena{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.gora{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-left));background:linear-gradient(var(--bg),transparent)}
.gora h1{font:600 20px/1 'Barlow Condensed',sans-serif;margin:0 6px 0 0;white-space:nowrap}
select,button{font:500 16px 'Barlow Condensed',sans-serif;color:var(--ink);background:#20242a;border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 12px}
select{flex:1;max-width:340px}
button{cursor:pointer;white-space:nowrap}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dol{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:grid;gap:8px}
.rzad{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.rzad::-webkit-scrollbar{display:none}
.rzad button{flex:none}
.zapis{background:#2b3a2e;border-color:#3d5a43}
#karta{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);backdrop-filter:blur(8px);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 40px;transform:translateX(105%);transition:transform .25s}
#karta.otw{transform:none}
#karta h2{font:600 26px/1.1 'Barlow Condensed',sans-serif;margin:0 0 4px}
#karta h3{font:600 17px 'Barlow Condensed',sans-serif;margin:18px 0 6px;color:var(--acc)}
#karta table{width:100%;border-collapse:collapse;font-size:14px}
#karta td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
#karta td:last-child{text-align:right;white-space:nowrap;padding-left:10px}
#karta ul{margin:0;padding-left:18px;font-size:14px;color:var(--dim)}
.braki li{color:#f0c27a}
pre{white-space:pre-wrap;background:#14171b;border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.45 ui-monospace,Menlo,monospace;margin:6px 0}
.dim{color:var(--dim);font-size:13px}
#nakladka{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
#nakladka img{max-width:100%;max-height:75vh;border:1px solid var(--line)}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:none}
@media (prefers-reduced-motion:reduce){#karta{transition:none}}
</style>
</head>
<body>
<canvas id="scena"></canvas>
<div class="gora">
  <h1>Modele 3D</h1>
  <select id="wybor" aria-label="Statek albo klasa"></select>
  <button id="infoBtn" aria-label="Dane i prompt">Dane · prompt</button>
</div>
<div class="dol">
  <div class="rzad" id="katy"></div>
  <div class="rzad">
    <button id="tlo">Tło: czarne</button>
    <button id="wydech">Wydech: wył.</button>
    <button id="napis">Napis: wył.</button>
    <button class="zapis" id="png">Zapisz PNG</button>
    <button class="zapis" id="jpg">Zapisz JPG</button>
  </div>
</div>
<aside id="karta" aria-label="Dane jednostki"></aside>
<div id="nakladka"><img id="nakImg" alt="Zapisany obrazek"><div>Przytrzymaj obrazek palcem → „Zapisz obraz”.</div><button id="nakZamknij">Zamknij</button></div>
<div id="toast"></div>

/* ---------- detale wyglądu (wyglad.csv → elementy z modele_3d.py) ---------- */
let hullMat=null, napisy=[], napisOn=false;
const D2R=Math.PI/180;
function halfU(u,m){const p=u.prof;if(m<=p[0][0])return p[0][1];for(let i=0;i<p.length-1;i++){const[m0,h0]=p[i],[m1,h1]=p[i+1];if(m>=m0&&m<=m1)return h0+(h1-h0)*(m-m0)/((m1-m0)||1)}return p[p.length-1][1]}
function pos(x,r,phi){const a=phi*D2R;return new THREE.Vector3(-r*Math.cos(a),x,r*Math.sin(a))}   // phi 0 = góra, 90 = bok od kamery (widok z boku)
const linia=(g,p,m)=>g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),m));
function detale(g,u){
  napisy=[]; const eps=Math.max(0.02,u.L*0.0002), Y=new THREE.Vector3(0,1,0);
  const cienka=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.09}), zarys=new THREE.LineBasicMaterial({color:0x22262b});
  for(const e of (u.elementy||[])){
    if(e.typ==='linie'){
      for(const x of e.xs){const r=halfU(u,x)+eps,p=[];for(let i=0;i<=96;i++)p.push(pos(x,r,i*360/96));linia(g,p,cienka)}
      const n=Math.max(40,Math.round(u.L));
      for(let k=0;k<e.n;k++){const p=[];for(let i=0;i<=n;i++){const x=u.L*i/n;p.push(pos(x,halfU(u,x)+eps,k*360/e.n))}linia(g,p,cienka)}
    }else if(e.typ==='napis'){
      const len=e.x1-e.x0, hk=e.kat*D2R, arc=e.r*2*hk;
      for(const strona of [90,270]){
        const Hc=1024, Wc=Math.max(64,Math.round(Hc*arc/len)), cv=document.createElement('canvas'); cv.width=Wc; cv.height=Hc;
        const c=cv.getContext('2d'); c.translate(Wc/2,Hc/2); c.rotate(strona===90?-Math.PI/2:Math.PI/2);
        c.fillStyle='#111'; c.textAlign='center'; c.textBaseline='middle';
        const fn=e.nazwa?Math.min(Wc*0.5,Hc*0.92/(e.nazwa.length*0.68)):0;
        const fr=e.nazwa?Math.min(fn*0.42,Hc*0.92/(e.numer.length*0.62)):Math.min(Wc*0.42,Hc*0.92/(e.numer.length*0.62));
        const tot=fn+(fn?fr*0.3:0)+fr, y0=-tot/2;
        if(fn){c.font=`600 ${fn}px "Barlow Condensed","Arial Narrow",sans-serif`;c.fillText(e.nazwa,0,y0+fn/2)}
        c.font=`500 ${fr}px "Barlow Condensed","Arial Narrow",sans-serif`;c.fillText(e.numer,0,y0+tot-fr/2);
        const tx=new THREE.CanvasTexture(cv); tx.encoding=THREE.sRGBEncoding; tx.anisotropy=8;
        const th=(strona-90)*D2R;
        const m=new THREE.Mesh(new THREE.CylinderGeometry(e.r+eps*2,e.r+eps*2,len,48,1,true,th-hk,2*hk),
          new THREE.MeshStandardMaterial({map:tx,transparent:true,metalness:0.1,roughness:0.8,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
        m.position.y=(e.x0+e.x1)/2; m.visible=napisOn; g.add(m); napisy.push(m);
      }
    }else if(e.typ==='okna_pierscien'&&u.ring){
      const q=u.ring, r=q.R-q.h-0.06, n=Math.floor(2*Math.PI*r/e.odstep), d=new THREE.Object3D();
      const im=new THREE.InstancedMesh(new THREE.PlaneGeometry(e.szer,e.wys),new THREE.MeshBasicMaterial({color:0xffd9a0,side:THREE.DoubleSide}),n*2); let k=0;
      for(const dx of [-q.w*0.22,q.w*0.22])for(let i=0;i<n;i++){d.position.copy(pos(q.x+dx,r,(i+0.5)*360/n));d.lookAt(0,q.x+dx,0);d.updateMatrix();im.setMatrixAt(k++,d.matrix)}
      g.add(im);
    }else if(e.typ==='okna'){
      const mt=mat(0x1b2633,0.8,0.15,{side:THREE.DoubleSide}), r=halfU(u,e.x);
      for(const phi of e.phis){const m=new THREE.Mesh(new THREE.PlaneGeometry(e.szer,e.wys),mt);m.position.copy(pos(e.x,r+0.03,phi));m.lookAt(pos(e.x,r+5,phi));g.add(m)}
    }else if(e.typ==='swiatlo'){
      const m=new THREE.Mesh(new THREE.SphereGeometry(e.r,12,8),new THREE.MeshBasicMaterial({color:e.kolor}));m.position.copy(pos(e.x,halfU(u,e.x)+e.r*0.6,e.phi));g.add(m);
    }else if(e.typ==='kapsula'){
      const k=new THREE.Group(); k.add(new THREE.Mesh(new THREE.CylinderGeometry(e.d/2,e.d/2,e.dl-e.d,24),hullMat));
      for(const s of [-1,1]){const b=new THREE.Mesh(new THREE.SphereGeometry(e.d/2,24,12),hullMat);b.position.y=s*(e.dl-e.d)/2;k.add(b)}
      const a=e.phi*D2R, dir=e.kier==='styczna'?new THREE.Vector3(Math.sin(a),0,Math.cos(a)):Y.clone();
      k.quaternion.setFromUnitVectors(Y,dir); k.position.copy(pos(e.x,e.rad,e.phi)); g.add(k);
    }else if(e.typ==='obrys'){
      const p=[],n=24,h=e.pol,R=x=>halfU(u,x)+eps*2,xm=(e.x0+e.x1)/2;
      for(let i=0;i<=n;i++){const x=e.x0+(e.x1-e.x0)*i/n;p.push(pos(x,R(x),e.phi-h))}
      for(let i=0;i<=n;i++)p.push(pos(e.x1,R(e.x1),e.phi-h+2*h*i/n));
      for(let i=n;i>=0;i--){const x=e.x0+(e.x1-e.x0)*i/n;p.push(pos(x,R(x),e.phi+h))}
      for(let i=n;i>=0;i--)p.push(pos(e.x0,R(e.x0),e.phi-h+2*h*i/n));
      linia(g,p,zarys); const s=[];for(let i=0;i<=n;i++)s.push(pos(xm,R(xm),e.phi-h+2*h*i/n)); linia(g,s,zarys);
    }else if(e.typ==='pret'){
      const len=e.x1-e.x0,xm=(e.x0+e.x1)/2,m=new THREE.Mesh(new THREE.BoxGeometry(e.gr,len,e.gr),mat(0x6b7077,0.6,0.5));
      m.position.copy(pos(xm,halfU(u,xm)+e.dr+e.gr/2,e.phi)); m.rotation.y=(e.phi-90)*D2R; g.add(m);
    }else if(e.typ==='kolnierz'){
      const a=e.phi*D2R,dir=new THREE.Vector3(-Math.cos(a),0,Math.sin(a)),r0=halfU(u,e.x);
      const m=new THREE.Mesh(new THREE.CylinderGeometry(e.r,e.r,e.dl,40),mat(0x7d838b,0.6,0.45));m.quaternion.setFromUnitVectors(Y,dir);m.position.copy(pos(e.x,r0+e.dl/2-0.2,e.phi));g.add(m);
      const t=new THREE.Mesh(new THREE.TorusGeometry(e.r*0.75,e.r*0.12,12,40),mat(0x2a2d31,0.6,0.4));t.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir);t.position.copy(pos(e.x,r0+e.dl-0.15,e.phi));g.add(t);
    }else if(e.typ==='kula'){
      const m=new THREE.Mesh(new THREE.SphereGeometry(e.r,24,16),mat(0xdfe3e8,0.2,0.3));m.position.copy(pos(e.x,e.rad,e.phi));g.add(m);
    }else if(e.typ==='tuba'){
      const m=new THREE.Mesh(new THREE.CylinderGeometry(e.r,e.r,e.x1-e.x0,16),mat(0x3a3f46,0.5,0.4));m.position.copy(pos((e.x0+e.x1)/2,e.rad,e.phi));g.add(m);
    }else if(e.typ==='plyta'){
      const m=new THREE.Mesh(new THREE.CylinderGeometry(e.r,e.r,e.gr,48),mat(W('kolor_zderzakow')||0xa9adb3,0.7,0.4));m.position.y=e.x;g.add(m);
    }else if(e.typ==='dysza'){
      const t=new THREE.Mesh(new THREE.TorusGeometry(e.r,e.gr,16,64),mat(0x24272b,0.7,0.35));t.rotation.x=Math.PI/2;t.position.y=u.L+e.gr*0.4;g.add(t);
    }
  }
}

  if(o.hangar&&o.hangar_szer>o.srodek+1){f.push(`a slightly wider hangar section near the rear (${Math.round(o.hangar_szer)} m)`);p.push(`trochę szersza sekcja hangaru z tyłu (${Math.round(o.hangar_szer)} m)`)}

  if(!pobieranie){nakladka(blob);return}

  catch(e){if(e&&e.code==='declined')toast(T('Anulowano','Cancelled'));else nakladka(blob)}
